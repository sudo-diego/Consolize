<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Consolize · rediseño (v2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --acc:#5cc8ff; --on-acc:#052238;
    --bg:#0d1220; --tile:#1f2a42; --fg:#fff; --mut:#9aa6bf; --dim:#66728c; }
  *{box-sizing:border-box}
  html,body{margin:0;background:#06080f;color:var(--fg);font:15px/1.4 "Roboto","Inter",system-ui,sans-serif}
  .top{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap;color:var(--mut);font-size:13px}
  .top button{background:#151e31;color:var(--fg);border:0;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
  .top button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
  .sw{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;padding:0}
  .sw.on{outline:2px solid #fff;outline-offset:2px}
  .keys{width:100%;text-align:center}
  kbd{background:#1a2439;border-radius:5px;padding:1px 6px;font:12px ui-monospace,monospace;color:var(--fg)}
  .tab{width:min(1200px,96vw);aspect-ratio:16/10;margin:0 auto 18px;border-radius:22px;overflow:hidden;position:relative;
       background:radial-gradient(120% 90% at 85% -10%,#1d2c55 0%,transparent 55%),radial-gradient(90% 70% at -10% 110%,#13314a 0%,transparent 60%),var(--bg);
       box-shadow:0 0 0 10px #000,0 30px 80px #0008}
  .screen{position:absolute;inset:0;padding:26px 34px 0;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:18px;color:var(--mut);font-size:13px;height:22px}
  .bar .sp{flex:1}
  .bar svg{width:18px;height:18px;fill:var(--mut);vertical-align:-4px;margin-right:5px}
  .batg{display:inline-block;width:22px;height:11px;border:1.5px solid var(--mut);border-radius:3px;position:relative;margin-right:6px;vertical-align:-1px}
  .batg:after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:72%;background:var(--acc);border-radius:1px}
  /* Capas arriba (variante B) */
  .layers{display:flex;gap:30px;margin-top:18px;font-size:17px;align-items:baseline}
  .layers span{color:var(--dim);padding-bottom:6px;font-weight:500}
  .layers span.cur{color:var(--fg);box-shadow:0 2px 0 var(--acc)}
  .layers .lb{font-size:12px;color:var(--dim);border-radius:6px;background:#ffffff12;padding:2px 7px}
  .lbl{color:var(--mut);font-size:12px;letter-spacing:.08em;margin:30px 0 12px;text-transform:uppercase;font-weight:600}
  /* Mosaico igual al del panel (BadgeTile): fondo, insignia con el ícono, nombre y estado */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .t{height:68px;border-radius:16px;background:var(--tile);display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer;
     box-shadow:0 1px 0 #ffffff10 inset,0 6px 18px #0005;transition:transform .12s,box-shadow .12s;position:relative}
  .t .b{width:36px;height:36px;border-radius:11px;background:#ffffff21;display:grid;place-items:center;flex:none}
  .t .b svg{width:20px;height:20px;fill:#ffffffd9}
  .t.act .b{background:var(--acc)} .t.act .b svg{fill:var(--on-acc)} .t.act .s{color:var(--acc)}
  .t .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t .s{font-size:12px;color:var(--mut);white-space:nowrap}
  .t.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px #ffffff1f}
  .f{box-shadow:0 0 0 2px #fff,0 10px 26px #0008 !important;transform:translateY(-2px)}
  /* Biblioteca: ícono de la app y su nombre */
  .lib{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:6px}
  .app{border-radius:18px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.12s;background:#ffffff08}
  .app i{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:22px;color:#fffd}
  .app span{font-size:13px;text-align:center}
  .app small{font-size:11px;color:var(--acc);height:14px}
  /* Panel: vista previa a la izquierda, sus partes a la derecha */
  .pp{display:grid;grid-template-columns:1fr 330px;gap:30px;margin-top:22px;flex:1;min-height:0}
  .prev{border-radius:18px;background:linear-gradient(135deg,#2c4a3a,#1a2a3a 60%,#3a2a2a);position:relative;overflow:hidden;height:440px}
  .prev .card{position:absolute;inset:34px 70px;border-radius:22px;background:#0e1424f0;padding:16px;display:flex;flex-direction:column;gap:8px}
  .prev .hd{display:flex;justify-content:space-between;color:var(--mut);font-size:11px}
  .prev .sl{height:30px;border-radius:15px;background:var(--tile);position:relative;overflow:hidden}
  .prev .sl:after{content:"";position:absolute;inset:0 40% 0 0;background:var(--acc);opacity:.85}
  .prev .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .prev .mt{height:40px;border-radius:10px;background:var(--tile);display:flex;align-items:center;gap:6px;padding:0 6px;font-size:10px}
  .prev .mt b{width:22px;height:22px;border-radius:7px;background:#ffffff21;display:grid;place-items:center}
  .prev .mt b svg{width:13px;height:13px;fill:#fffd}
  .prev .mt.act b{background:var(--acc)} .prev .mt.act b svg{fill:var(--on-acc)}
  .prev .sec{font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:4px}
  .list{display:flex;flex-direction:column;gap:6px}
  .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;transition:.12s}
  .li svg{width:20px;height:20px;fill:var(--mut)}
  .li .v{margin-left:auto;color:var(--mut);font-size:13px}
  .li.f{background:#ffffff12}
  /* Más: grupos primero; al entrar, lo de adentro */
  .crumb{color:var(--mut);font-size:14px;margin-top:22px}
  .crumb b{color:var(--fg);font-weight:500}
  .pin{position:absolute;top:8px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
  /* Dock (variante A) */
  .dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:22px;
        background:#0b1120d9;backdrop-filter:blur(14px);box-shadow:0 10px 30px #0008,0 1px 0 #ffffff12 inset}
  .dk{display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:15px;color:var(--mut);font-weight:500;cursor:pointer;transition:.12s}
  .dk svg{width:20px;height:20px;fill:currentColor}
  .dk.cur{color:var(--fg);background:#ffffff14}
  .dk.f{color:var(--on-acc);background:var(--acc);transform:none;box-shadow:none!important}
  .hint{position:absolute;right:34px;bottom:18px;display:flex;gap:18px;color:var(--dim);font-size:13px}
  .hint b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffffff14;color:var(--fg);font-size:11px;margin-right:6px}
  .bt{display:inline-flex;align-items:center;gap:7px}
  .hero{display:flex;align-items:center;gap:40px;margin-top:26px}
  .hero .big{display:flex;align-items:center;gap:18px}
  .hero .pct{font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1}
  .hero .sub{color:var(--mut);font-size:14px;margin-top:4px}
  .chips{display:flex;gap:10px;flex:1}
  .chip{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:var(--tile)}
  .chip svg{width:18px;height:18px;fill:var(--acc);flex:none}
  .chip b{display:block;font-size:15px;font-weight:600}
  .chip span{display:block;font-size:11px;color:var(--mut)}
  .groups{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
  .grp{background:linear-gradient(180deg,#1a2439,#141d30);border-radius:20px;padding:14px 10px 10px;box-shadow:0 1px 0 #ffffff10 inset,0 8px 24px #0005}
  .gh{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;padding:0 6px 10px}
  .gh .b{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
  .gh .b svg{width:18px;height:18px;fill:var(--on-acc)}
  .grp .li{padding:10px 8px;font-size:14px}
  .grp .li svg{width:18px;height:18px;flex:none}
  .grp .li .v{font-size:12px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:8px;flex:none}
  .grp .li span:nth-of-type(1){flex:1}
  /* Foco como en la Switch: borde que respira; la página entra subiendo un poco */
  @keyframes breathe{0%,100%{box-shadow:0 0 0 2px #fff,0 0 0 6px transparent,0 10px 26px #0008}50%{box-shadow:0 0 0 2px #fff,0 0 0 6px color-mix(in srgb,var(--acc) 50%,transparent),0 10px 26px #0008}}
  .t.f,.app.f{animation:breathe 1.6s ease-in-out infinite}
  .li.f{box-shadow:inset 0 0 0 2px #fff;background:#ffffff12}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .enter{animation:enter .22s ease-out}
  .note{max-width:1200px;margin:0 auto 30px;color:var(--mut);font-size:14px;padding:0 20px}
  .note h4{color:var(--fg);margin:0 0 4px}
  .page{flex:1;display:grid;place-items:center;color:var(--mut)}
  .page h2{color:var(--fg);font-size:26px;font-weight:500;margin:0;text-align:center}
</style>
</head>
<body>
<div class="top">
  <button data-v="A" class="on">A · Dock abajo</button>
  <button data-v="B">B · Capas</button>
  <span style="margin-left:14px">Acento:</span><span id="acc"></span>
  <div class="keys"><kbd>←↑→↓</kbd> moverse · <kbd>Enter</kbd> A · <kbd>Esc</kbd> B · <kbd>Y</kbd> fijar en Inicio · <kbd>Q</kbd>/<kbd>E</kbd> LB/RB</div>
</div>
<div class="tab"><div class="screen" id="screen"></div></div>
<div class="note" id="note"></div>

  else if(k==='y')pin();
  else if(k==='q'||k==='e'){const d=k==='e'?1:-1;page=null;more=null;
    if(V==='A'){const t=['home','lib','panel','more'];tab=t[(t.indexOf(tab)+d+4)%4];} else layer=(layer+d+4)%4; render();}});
document.getElementById('screen').addEventListener('click',e=>{const el=e.target.closest('[data-nav]');if(el){setF(el);act(el);}});
document.getElementById('acc').innerHTML=ACC.map(([c,o],i)=>`<button class="sw ${i?'':'on'}" style="background:${c}" data-c="${c}" data-o="${o}"></button>`).join(' ');
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--acc',b.dataset.c);document.documentElement.style.setProperty('--on-acc',b.dataset.o);document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));});
const NOTES={A:'<h4>A · Dock abajo</h4>Cuatro destinos en un dock flotante. LB/RB también pasan entre ellos.',
 B:'<h4>B · Capas</h4>Los mismos cuatro, como palabras arriba que se cambian con LB/RB (sin barra ni dock).'};
document.querySelectorAll('.top button[data-v]').forEach(b=>b.onclick=()=>{V=b.dataset.v;page=null;more=null;document.querySelectorAll('.top button[data-v]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('note').innerHTML=NOTES[V];render();});
document.getElementById('note').innerHTML=NOTES.A;render();
</script>
</body>
</html>
