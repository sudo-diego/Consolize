# Capturas de la app en un emulador de tablet: se corre con un commit que diga [capturas] en su mensaje. Las capturas
# quedan en la versión "capturas" (Releases), para verlas sin instalar nada.
name: Capturas

on:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  shots:
    if: contains(github.event.head_commit.message, '[capturas]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar (depuración)
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: false
          script: bash tools/screens.sh
      - name: Publicar en "capturas"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view capturas >/dev/null 2>&1 || gh release create capturas --prerelease --title "Capturas" --notes "Capturas de la app en un emulador." --target "$GITHUB_SHA"
          for a in $(gh release view capturas --json assets --jq '.assets[].name'); do gh release delete-asset capturas "$a" -y; done
          gh release upload capturas shots/*.png shots/log.txt --clobber
