# Compila el APK en GitHub (sin computador) y lo deja para descargar en la tablet.
# - Cada push a main o a una rama claude/** compila la versión release.
# - Si están los secretos de la firma (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD), se firma con la
#   clave propia y se instala encima de la app que ya está (sin perder ajustes). Si no, con la de depuración.
# - El APK queda en la versión "prueba" (Releases), siempre con el último, y también como artefacto de la ejecución.
name: APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Firma (si están los secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Firmado con la clave propia"
          else
            echo "::warning::Sin secretos de firma: se firma con la clave de depuración (no se instala encima de la versión publicada)"
          fi

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Nombre del APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          branch=${GITHUB_REF_NAME//\//-}
          name="Consolize-$branch-$short.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publicar en "prueba"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prueba >/dev/null 2>&1 || \
            gh release create prueba --prerelease --title "Prueba (última compilación)" \
              --notes "APK de la última compilación de prueba. No es una versión publicada." --target "$GITHUB_SHA"
          # Solo el último APK: se borran los anteriores.
          for a in $(gh release view prueba --json assets --jq '.assets[].name'); do gh release delete-asset prueba "$a" -y; done
          gh release upload prueba "${{ steps.apk.outputs.name }}" --clobber
          gh release edit prueba --notes "Rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
